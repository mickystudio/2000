name: Build Signed Split APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Keystore & Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Secrets provided. Generating production release signing config..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "No custom release keystore secrets found. Generating automated keystore for CI build..."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias releaseKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=CI Build, OU=App, O=Vault, L=City, S=State, C=US"
            cat > android/key.properties <<EOF
          storePassword=android123
          keyPassword=android123
          keyAlias=releaseKey
          storeFile=upload-keystore.jks
          EOF
          fi

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-split-apks
          path: build/app/outputs/flutter-apk/*.apk
